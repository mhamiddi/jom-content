name: Configure Jom Content production secrets

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Cloudflare Pages production secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          JOM_API_TOKEN: ${{ secrets.JOM_API_TOKEN }}
          JOM_LOGIN_PASSWORD: ${{ secrets.JOM_LOGIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          account_id = os.environ["CF_ACCOUNT_ID"]
          project = "jom-content"
          url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{project}"
          payload = {
              "deployment_configs": {
                  "production": {
                      "env_vars": {
                          "JOM_API_TOKEN": {
                              "type": "secret_text",
                              "value": os.environ["JOM_API_TOKEN"],
                          },
                          "JOM_LOGIN_PASSWORD": {
                              "type": "secret_text",
                              "value": os.environ["JOM_LOGIN_PASSWORD"],
                          },
                      }
                  }
              }
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {os.environ['CF_API_TOKEN']}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = json.load(response)
          if not body.get("success"):
              raise SystemExit("Cloudflare API reported failure")
          print("Cloudflare Pages production secrets configured: JOM_API_TOKEN, JOM_LOGIN_PASSWORD")
          PY
