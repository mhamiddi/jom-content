name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run offline tests
        run: node --test tests/maturity-core.test.mjs tests/social-publish.test.mjs tests/threads-publish.test.mjs tests/threads-search.test.mjs tests/meta-publish.test.mjs

      - name: Stage public Pages files
        run: |
          rm -rf .deploy
          mkdir -p .deploy
          cp index.html topics.html analytics.html login.css dashboard-ui.css dashboard-ui.js auth.js carousel-template.js threads-approval-ui.js analytics-weekday.mjs analytics-data.json .deploy/
          cp -R functions .deploy/functions

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          trap 'rm -rf .deploy' EXIT
          npx wrangler pages deploy .deploy \
            --project-name=jom-content \
            --branch=master

      - name: Post-deploy audit
        run: |
          for attempt in 1 2 3 4 5; do
            HEALTH=$(curl -fsS "https://jom-content.pages.dev/api/health?verify=${GITHUB_SHA}" || true)
            if printf '%s' "$HEALTH" | grep -q '"status":"ok"'; then
              break
            fi
            echo "Health not ready (attempt ${attempt}): ${HEALTH}"
            sleep 10
          done
          for ROUTE in / /topics.html /analytics.html /api/health; do
            STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" "https://jom-content.pages.dev${ROUTE}?verify=${GITHUB_SHA}")
            echo "${ROUTE}: ${STATUS}"
            [ "$STATUS" = "200" ] || exit 1
          done
          HEALTH=$(curl -fsS "https://jom-content.pages.dev/api/health?verify=${GITHUB_SHA}")
          echo "Health: $HEALTH"
          printf '%s' "$HEALTH" | grep -q '"status":"ok"'
          printf '%s' "$HEALTH" | grep -q '"kv":true'
          # Scripts the pages import must be served as JavaScript. A missing file falls back to
          # HTML, which makes the browser drop the whole module and leaves the page stuck loading.
          for ASSET in /analytics-weekday.mjs /dashboard-ui.js /auth.js; do
            TYPE=$(curl -fsS -L -o /dev/null -w "%{content_type}" "https://jom-content.pages.dev${ASSET}?verify=${GITHUB_SHA}")
            echo "${ASSET}: ${TYPE}"
            case "$TYPE" in *javascript*) ;; *) echo "asset not served as JavaScript: ${ASSET}"; exit 1 ;; esac
          done
          for EXPOSED in /functions/api/posts.js /.github/workflows/deploy.yml /CLAUDE.md /tests/maturity-core.test.mjs; do
            BODY=$(curl -fsS -L "https://jom-content.pages.dev${EXPOSED}?verify=${GITHUB_SHA}")
            echo "${EXPOSED}: fetched"
            case "$EXPOSED" in
              /functions/api/posts.js) if printf '%s' "$BODY" | grep -q '^import '; then echo "source exposed: ${EXPOSED}"; exit 1; fi ;;
              /.github/workflows/deploy.yml) if printf '%s' "$BODY" | grep -q 'name: Deploy to Cloudflare Pages'; then echo "source exposed: ${EXPOSED}"; exit 1; fi ;;
              /CLAUDE.md) if printf '%s' "$BODY" | grep -q '^# Jom Content'; then echo "source exposed: ${EXPOSED}"; exit 1; fi ;;
              /tests/maturity-core.test.mjs) if printf '%s' "$BODY" | grep -q "test('"; then echo "source exposed: ${EXPOSED}"; exit 1; fi ;;
            esac
          done
